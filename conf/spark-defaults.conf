# Exercise 4 - Graph OLAP driver tuning.
#
# Everything runs local[*], so the DRIVER is the whole cluster: it holds every
# cached cuboid and every collected aggregation. Spark's 1g default is far too
# small for a 568k-edge graph and was the direct cause of a driver OOM.
# The box has 15 GB; 10g leaves room for the OS, the HDFS daemons and Memgraph.
spark.driver.memory              10g

# The OOM stack was Arrays.copyOfRange <- StringConcat.toString <-
# QueryExecution.explainString: the driver died building the *query plan string*
# for the SQL UI, not on the data itself. The iterative queries (k-core peeling,
# frontier expansion) build deep plans, so cap how much plan text is ever
# materialised, and stop the UI from retaining every execution of the sweep.
spark.sql.maxPlanStringLength    8192
spark.ui.retainedJobs            120
spark.ui.retainedStages          240
spark.sql.ui.retainedExecutions  60

spark.sql.shuffle.partitions     32
